# W25-E: pdf-internal is `internal: true` — Docker refuses this network a
# default route to the outside world, so pdf-renderer cannot reach the real
# internet even if the app-level request-interception in server.mjs ever
# regressed. Host access to published ports on an internal network is not
# portable across Docker runtimes, so CI runs its probe from the integration
# service on this network. Container-to-container traffic remains available:
# pdf-renderer can resolve/reach the "canary" container — which is the point:
# canary simulates "any host the renderer might try to call" for the
# interception proof in scripts/test-pdf-integration.mjs, while this network
# config is the separate container-level egress-deny layer (defense-in-depth,
# not the same control as page.on('request') interception).
networks:
  pdf-internal:
    internal: true

services:
  canary:
    image: node:22-alpine
    command: ["node", "/canary/pdf-canary-server.mjs"]
    volumes:
      - ./scripts/pdf-canary-server.mjs:/canary/pdf-canary-server.mjs:ro
    environment:
      CANARY_PORT: 9000
    networks:
      - pdf-internal
    ports:
      - "127.0.0.1:9000:9000"
  pdf-renderer:
    build: ./services/pdf-renderer
    # A fixed local tag so CI can `docker build -t report-supporter/pdf-renderer:ci`
    # once, SBOM + scan that exact image, then `docker compose up` (no
    # --build) reuses it verbatim for the integration test — SBOM, scan, and
    # integration test all run against the SAME image, never a rebuild.
    image: report-supporter/pdf-renderer:ci
    environment:
      PORT: 8080
      # Fail fast with a clear message at `docker-compose up` if the
      # operator forgot to set a real token, instead of silently defaulting
      # to the local dev token and crash-looping inside the container (the
      # image bakes NODE_ENV=production, and the startup guard in
      # server.mjs refuses to boot with the local default token in prod).
      PDF_RENDERER_TOKEN: ${PDF_RENDERER_TOKEN:?Set PDF_RENDERER_TOKEN (see .env.example) before running docker-compose -f docker-compose.pdf.yml up}
      # W24-F: conservative capacity envelope (clamped 1..4 in server.mjs).
      PDF_MAX_CONCURRENCY: ${PDF_MAX_CONCURRENCY:-2}
      # Chromium's setuid/user-namespace sandbox cannot initialize after
      # cap_drop: ALL + no-new-privileges. The container itself supplies the
      # isolation boundary (read-only FS, no caps, internal-only network).
      PUPPETEER_DISABLE_SANDBOX: "true"
    networks:
      - pdf-internal
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      # tmpfs must not exceed the memory envelope below.
      - /tmp:size=384m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # W24-F resource envelope — a saturating burst is rejected (503) rather than
    # OOM-killing the whole service. Defaults reviewed against peak RSS + headroom;
    # tune from the CI soak artifact, not by guessing.
    mem_limit: 1g
    mem_reservation: 512m
    pids_limit: 256
    cpus: 1.5
    healthcheck:
      # Readiness (not liveness): only green when Chromium is connected.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
  integration:
    profiles:
      - integration
    # Reuse the exact renderer image already built, SBOM'd, and scanned. The
    # repository bind mount supplies the host-installed integration-test
    # dependencies without creating a second untracked test image.
    image: report-supporter/pdf-renderer:ci
    working_dir: /workspace
    command: ["node", "scripts/test-pdf-integration.mjs"]
    volumes:
      - ./:/workspace:ro
    environment:
      PDF_RENDERER_URL: http://pdf-renderer:8080
      PDF_RENDERER_TOKEN: ${PDF_RENDERER_TOKEN:?Set PDF_RENDERER_TOKEN before running the integration profile}
      PDF_CANARY_URL: http://canary:9000
      PDF_CANARY_URL_FROM_RENDERER: http://canary:9000
    networks:
      - pdf-internal
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
