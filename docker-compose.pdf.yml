services:
  pdf-renderer:
    build: ./services/pdf-renderer
    environment:
      PORT: 8080
      PDF_RENDERER_TOKEN: ${PDF_RENDERER_TOKEN:-local-render-token}
      # W24-F: conservative capacity envelope (clamped 1..4 in server.mjs).
      PDF_MAX_CONCURRENCY: ${PDF_MAX_CONCURRENCY:-2}
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      # tmpfs must not exceed the memory envelope below.
      - /tmp:size=384m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    # W24-F resource envelope — a saturating burst is rejected (503) rather than
    # OOM-killing the whole service. Defaults reviewed against peak RSS + headroom;
    # tune from the CI soak artifact, not by guessing.
    mem_limit: 1g
    mem_reservation: 512m
    pids_limit: 256
    cpus: 1.5
    healthcheck:
      # Readiness (not liveness): only green when Chromium is connected.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
