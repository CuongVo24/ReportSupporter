name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@10.9.2 # keep in sync with "packageManager" in package.json
      - run: npm ci
      - run: npm run check:encoding
      - run: npm run lint
      - run: npm run typecheck
      - name: "QA package — fixtures, catalog, traceability and meta-gates"
        run: |
          npm run qa:check
          git diff --exit-code -- \
            Design/QA/KichBan-Test-Tong-The.md \
            Design/QA/fixtures/manifest.json \
            Design/QA/generated \
            Design/QA/templates/case-results.template.csv
      # W24-H / W25-2-J: validate the deployment env contract. This MUST
      # actually exercise the production branch (NODE_ENV=production + a
      # full valid fixture) — running with a bare/dev env would silently
      # skip every production-only check (secrets, Redis, operator token,
      # hop count) and always pass trivially, proving nothing.
      - name: "Production config checker — valid production fixture must pass"
        run: npm run check:production-config
        env:
          NODE_ENV: production
          TRUSTED_PROXY_MODE: vercel
          TRUSTED_PROXY_HOPS: "1"
          UPSTASH_REDIS_REST_URL: "https://ci-fixture-redis.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "ci-fixture-upstash-token-0000000"
          RATE_LIMIT_SECRET: "ci-fixture-rate-limit-secret-0000"
          RATE_LIMIT_SECRET_VERSION: "v1"
          OPERATOR_DIAGNOSTICS_TOKEN: "ci-fixture-operator-token-0000000"
      - name: "Production config checker — invalid fixture must fail (proves the gate actually enforces)"
        run: |
          if NODE_ENV=production npm run check:production-config; then
            echo "::error::check-production-config.mjs incorrectly PASSED on a production fixture missing required secrets (Redis/RATE_LIMIT_SECRET/OPERATOR_DIAGNOSTICS_TOKEN) — the gate is not actually enforcing anything."
            exit 1
          fi
          echo "Invalid fixture correctly rejected."

      # --- Lane: Supply chain security & dual workspace audit ----------------
      - name: "CI Actions pinned to full commit SHA (no mutable tags/branches)"
        run: node scripts/check-ci-actions.mjs
      - name: "Supply chain check — external URLs, integrity, & security waivers"
        run: node scripts/check-supply-chain.mjs
      - name: "Production audit — root workspace"
        run: |
          npm audit --omit=dev --json > test-results/root-audit.json || true
          npm audit --omit=dev
      - name: "Production audit — PDF renderer service workspace"
        run: |
          cd services/pdf-renderer
          npm ci
          npm audit --omit=dev --json > ../../test-results/pdf-renderer-audit.json || true
          npm audit --omit=dev

      # --- Lane: unit/mock (node env, no browser, no Docker) -----------------
      - name: "Unit/mock tests + coverage gate (incl. security fuzz suites)"
        run: npm run test:coverage
      - name: "Flake gate — pipeline-client circuit-breaker suite x20, no timeout increase"
        run: |
          for i in $(seq 1 10); do
            echo "::group::concurrency/abort repeat run $i/10"
            npx vitest run \
              src/modules/pipeline/pipeline-client.test.ts \
              src/modules/write/ai/adapters/http-adapter.test.ts \
              src/app/api/ai/__security__/ai-stream-bounds.fuzz.test.ts \
              src/modules/import/worker-protocol.test.ts \
              --maxWorkers=1
            npm run test:pdf-unit
            echo "::endgroup::"
          done
      - run: npm run test:pdf-unit
      - run: npm run test:performance
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: coverage-report
          path: coverage
          retention-days: 90

      - run: npm run build

      # --- Lane: production browser (real Chromium, production build) -------
      - run: npx playwright install --with-deps chromium
      # W24-O canonical perf gate: production build + actual Chromium + actual worker
      - name: "Production browser E2E — performance (real Chromium + real worker)"
        run: npm run test:perf:e2e
        env:
          PLAYWRIGHT_USE_BUILD: "1"
      - run: npm run perf:collect
      - run: npm run check:bundle
      - name: "Production browser E2E — functional"
        run: npm run test:e2e
        env:
          PLAYWRIGHT_USE_BUILD: "1"

      # --- Lane: PDF renderer image — build ONCE, SBOM + scan that exact
      # digest, then reuse it (no rebuild) for the Docker isolation lane
      # below, so evidence is bound to the image that's actually tested.
      - name: "Build pdf-renderer image (single build, tag reused everywhere below)"
        run: docker build -t report-supporter/pdf-renderer:ci services/pdf-renderer
      - name: "Resolve pdf-renderer image digest"
        run: |
          DIGEST=$(docker image inspect report-supporter/pdf-renderer:ci --format '{{.Id}}')
          echo "PDF_RENDERER_IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
      - name: "SBOM — pdf-renderer image (SPDX)"
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: report-supporter/pdf-renderer:ci
          format: spdx-json
          output-file: test-results/pdf-renderer-sbom.spdx.json
      # Keep the complete Critical/High report as release evidence, including
      # vulnerabilities for which Debian has not published a fixed package.
      - name: "Vulnerability report — pdf-renderer image (Trivy, all Critical/High)"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: report-supporter/pdf-renderer:ci
          format: json
          output: test-results/pdf-renderer-trivy.json
          severity: "CRITICAL,HIGH"
          ignore-unfixed: "false"
          exit-code: "0"
      # Fail only when an actionable fixed version exists. Unfixed findings
      # remain visible in the JSON evidence above instead of making CI
      # permanently red while the upstream Debian package has no fix.
      - name: "Vulnerability gate — fixable Critical/High must be zero"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: report-supporter/pdf-renderer:ci
          format: table
          severity: "CRITICAL,HIGH"
          ignore-unfixed: "true"
          exit-code: "1"

      # --- Lane: Docker isolation (PDF renderer sandbox) ----------------------
      # docker-compose.pdf.yml requires PDF_RENDERER_TOKEN (no default) — the
      # image bakes NODE_ENV=production, and server.mjs's startup guard
      # refuses to boot with the local dev default token in production, so
      # this MUST be a real (CI-only, non-default) value here, not just on
      # the later test step that only talks to the already-running container.
      # No --build here: reuses the exact image just built/SBOM'd/scanned above.
      # Wait on the service's real /ready healthcheck before starting the
      # host-side probe. Chromium cold-start can legitimately overlap the old
      # probe's 30s polling window on a constrained shared runner.
      - run: docker compose -f docker-compose.pdf.yml up -d --wait --wait-timeout 60
        env:
          PDF_RENDERER_TOKEN: ci-integration-test-token-not-local-default
      - name: "Docker isolation — PDF render, script/JS-off proof, egress canary, admission control"
        run: |
          if ! docker compose -f docker-compose.pdf.yml --profile integration run --rm --no-deps integration; then
            docker compose -f docker-compose.pdf.yml ps
            docker compose -f docker-compose.pdf.yml logs --no-color
            exit 1
          fi
        env:
          PDF_RENDERER_TOKEN: ci-integration-test-token-not-local-default
      - if: always()
        run: docker compose -f docker-compose.pdf.yml down
        env:
          PDF_RENDERER_TOKEN: ci-integration-test-token-not-local-default

      # --- Release evidence manifest — links commit, lockfile hashes, image
      # digest, SBOM, scan, and both audits into one offline-verifiable file.
      - name: "Generate release evidence manifest"
        if: always()
        run: node scripts/generate-release-evidence.mjs --strict

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: qa-and-security-evidence
          retention-days: 90
          path: |
            playwright-report
            test-results
