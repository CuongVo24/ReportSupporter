name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:encoding
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:subsystems
      - run: npm run test:performance
      - run: npm run build
      - run: npm run check:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_USE_BUILD: "1"
      - run: docker compose -f docker-compose.pdf.yml up --build -d
      - run: npm run test:pdf-integration
        env:
          PDF_RENDERER_URL: http://127.0.0.1:8080
          PDF_RENDERER_TOKEN: local-render-token
      - if: always()
        run: docker compose -f docker-compose.pdf.yml down
      - run: npm audit --omit=dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-evidence
          path: |
            playwright-report
            test-results
