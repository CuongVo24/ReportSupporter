name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdaf5df # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:encoding
      - run: npm run lint
      - run: npm run typecheck
      # W24-H: validate the deployment env contract
      - run: npm run check:production-config

      # --- Lane: Supply chain security & dual workspace audit ----------------
      - name: "Supply chain check — external URLs, integrity, & security waivers"
        run: node scripts/check-supply-chain.mjs
      - name: "Production audit — root workspace"
        run: |
          npm audit --omit=dev --json > test-results/root-audit.json || true
          npm audit --omit=dev
      - name: "Production audit — PDF renderer service workspace"
        run: |
          cd services/pdf-renderer
          npm ci
          npm audit --omit=dev --json > ../../test-results/pdf-renderer-audit.json || true
          npm audit --omit=dev

      # --- Lane: unit/mock (node env, no browser, no Docker) -----------------
      - name: "Unit/mock tests + coverage gate (incl. security fuzz suites)"
        run: npm run test:coverage
      - name: "Flake gate — pipeline-client circuit-breaker suite x20, no timeout increase"
        run: |
          for i in $(seq 1 20); do
            echo "::group::pipeline-client repeat run $i/20"
            npx vitest run src/modules/pipeline/pipeline-client.test.ts --maxWorkers=2
            echo "::endgroup::"
          done
      - run: npm run test:pdf-unit
      - run: npm run test:performance
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: coverage-report
          path: coverage

      - run: npm run build

      # --- Lane: production browser (real Chromium, production build) -------
      - run: npx playwright install --with-deps chromium
      # W24-O canonical perf gate: production build + actual Chromium + actual worker
      - name: "Production browser E2E — performance (real Chromium + real worker)"
        run: npm run test:perf:e2e
        env:
          PLAYWRIGHT_USE_BUILD: "1"
      - run: npm run perf:collect
      - run: npm run check:bundle
      - name: "Production browser E2E — functional"
        run: npm run test:e2e
        env:
          PLAYWRIGHT_USE_BUILD: "1"

      # --- Lane: Docker isolation (PDF renderer sandbox) ----------------------
      # docker-compose.pdf.yml requires PDF_RENDERER_TOKEN (no default) — the
      # image bakes NODE_ENV=production, and server.mjs's startup guard
      # refuses to boot with the local dev default token in production, so
      # this MUST be a real (CI-only, non-default) value here, not just on
      # the later test step that only talks to the already-running container.
      - run: docker compose -f docker-compose.pdf.yml up --build -d
        env:
          PDF_RENDERER_TOKEN: ci-integration-test-token-not-local-default
      - name: "Docker isolation — PDF render, script/JS-off proof, egress canary, admission control"
        run: npm run test:pdf-integration
        env:
          PDF_RENDERER_URL: http://127.0.0.1:8080
          PDF_RENDERER_TOKEN: ci-integration-test-token-not-local-default
          PDF_CANARY_URL: http://127.0.0.1:9000
          PDF_CANARY_URL_FROM_RENDERER: http://canary:9000
      - if: always()
        run: docker compose -f docker-compose.pdf.yml down

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: qa-and-security-evidence
          path: |
            playwright-report
            test-results
